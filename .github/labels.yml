# Iconical — Shared GitHub Labels
# Names are preserved for compatibility with existing templates.

# Change types
- name: "💥 Breaking Change"
  color: "b60205"
  description: "A change that may require updates to existing integrations or usage."

- name: "🐛 Bug"
  color: "d73a4a"
  description: "Something is not working as intended."

- name: "📖 Documentation"
  color: "0075ca"
  description: "Documentation updates, corrections, or improvements."

- name: "🚀 Enhancement"
  color: "a2eeef"
  description: "An improvement to existing functionality."

- name: "🛠️ Refactor"
  color: "c5def5"
  description: "Internal code improvements without intended behavior changes."

- name: "⚡ Performance"
  color: "1d76db"
  description: "Improvements to speed, memory use, or efficiency."

- name: "✨ New Feature"
  color: "0e8a16"
  description: "A new capability or feature."

- name: "🔧 Maintenance"
  color: "d4c5f9"
  description: "Routine maintenance and project upkeep."

- name: "📦 Dependencies"
  color: "0366d6"
  description: "Dependency updates, additions, or removals."

# Resolution and triage
- name: "🛑 Won't Fix"
  color: "eeeeee"
  description: "Reviewed and not planned for implementation."

- name: "💤 Stale"
  color: "fef2c0"
  description: "Inactive and awaiting review or follow-up."

- name: "🚫 No Stale"
  color: "c2e0c6"
  description: "Excluded from automated stale processing."

- name: "🔒 Security"
  color: "b60205"
  description: "Public security maintenance or advisories; report vulnerabilities privately."

- name: "🤷 Incomplete"
  color: "fbca04"
  description: "Additional information is needed to proceed."

- name: "🚫 Invalid"
  color: "e4e669"
  description: "Does not meet the requirements for a valid issue or request."

- name: "🙃 Duplicate"
  color: "cfd3d7"
  description: "Already reported or tracked elsewhere."

# Contributor opportunities
- name: "👶 Beginner Friendly"
  color: "7057ff"
  description: "Suitable for contributors who are new to this project."

- name: "🆘 Help Wanted"
  color: "008672"
  description: "Contributions or assistance from the community are welcome."

- name: "🧪 Experimental"
  color: "bfdadc"
  description: "Experimental functionality or changes under evaluation."

# Priorities
- name: "☢️ Priority: Critical"
  color: "b60205"
  description: "Critical impact requiring urgent maintainer attention."

- name: "⚡ Priority: High"
  color: "d93f0b"
  description: "High-impact work requiring elevated attention."

- name: "🔥 Priority: Medium"
  color: "fbca04"
  description: "Moderate priority under the current project roadmap."

- name: "❄️ Priority: Low"
  color: "c2e0c6"
  description: "Lower-priority work that may be scheduled later."

# Releases and versioning
- name: "🚀 Release"
  color: "5319e7"
  description: "Release preparation, publishing, or related maintenance."

- name: "🔟 Major"
  color: "b60205"
  description: "A major version change under the project's versioning policy."

- name: "🔢 Minor"
  color: "0e8a16"
  description: "A minor version change under the project's versioning policy."

# Estimated effort
- name: "⏳ Time: Long"
  color: "333333"
  description: "Estimated to require substantial implementation effort."

- name: "⌚ Time: Medium"
  color: "999999"
  description: "Estimated to require a moderate amount of effort."

- name: "⏲️ Time: Short"
  color: "eeeeee"
  description: "Estimated to require relatively little implementation effort."