name: 💖 Generate Sponsor Images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-images
  cancel-in-progress: false

jobs:
  update-sponsors:
    name: Generate and publish sponsor images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check sponsor provider configuration
        shell: bash
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
          SPONSORKIT_PATREON_TOKEN: ${{ secrets.SPONSORKIT_PATREON_TOKEN }}
        run: |
          if [[ -z "$SPONSORKIT_GITHUB_TOKEN" && -z "$SPONSORKIT_PATREON_TOKEN" ]]; then
            echo "::error::Configure a supported SponsorKit provider before running this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate sponsor images
        run: pnpm run build
        env:
          SPONSORKIT_GITHUB_LOGIN: imthatdev
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
          SPONSORKIT_PATREON_TOKEN: ${{ secrets.SPONSORKIT_PATREON_TOKEN }}

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: update sponsor images"
          add: "sponsors.*"
        env:
          GITHUB_TOKEN: ${{ github.token }}